# EcoThread Spring Boot Application Properties
server.port=5577
spring.application.name=ecothread-backend

# Google Cloud APIs configuration
google.cloud.vision.api-key=${GOOGLE_VISION_API_KEY:}


# Active profile: default is dev (H2 in-memory). Set to prod for PostgreSQL.
spring.profiles.active=dev

# H2 Database configuration (Default dev profile)
spring.datasource.url=jdbc:h2:mem:ecothreaddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,ORDER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security Configuration
app.jwt.secret=4c7a8b9e1d2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b
app.jwt.expiration-ms=86400000

# NGO 80G Tax Exemption Organization Metadata
ecothread.org.name=EcoThread Sustainable Foundation
ecothread.org.reg-number=NGO-80G/CSR/2026/88421
ecothread.org.tax-exemption-id=AAATE1234F-80G-01
ecothread.org.address=74 Green Weave Way, EcoHub Park, Bengaluru 560100
ecothread.org.contact=support@ecothread.org | +91 80 4912 3000

# Swagger OpenAPI docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
