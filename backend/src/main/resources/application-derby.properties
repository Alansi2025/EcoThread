# EcoThread Apache Derby (Apache SQL) Database Profile
server.port=5577
spring.application.name=ecothread-backend-derby

# Apache Derby Network Server running on port 5566
spring.datasource.url=jdbc:derby://127.0.0.1:5566/ecothreaddb;create=true
spring.datasource.driver-class-name=org.apache.derby.client.ClientAutoloadedDriver
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.database-platform=org.hibernate.dialect.DerbyDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=4c7a8b9e1d2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b
app.jwt.expiration-ms=86400000

# NGO 80G Tax Exemption Metadata
